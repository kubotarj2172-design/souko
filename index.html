<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>倉庫収納物管理マップ</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#333; --muted:#666;
  --blue:#007bff; --blue2:#0069d9; --shadow:0 2px 4px rgba(0,0,0,.05);
}
*{ box-sizing:border-box; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  margin:20px; background:var(--bg); color:var(--text);
}
h1{ font-size:1.5rem; margin:0 0 15px; }

.form-button{
  display:inline-flex; align-items:center; justify-content:center;
  padding:10px 16px; border-radius:8px;
  background:var(--blue); color:#fff; border:1px solid var(--blue2);
  text-decoration:none; font-size:1rem; font-weight:700;
  cursor:pointer; transition:filter .2s, transform .02s;
  margin:0 0 15px;
}
.form-button:hover{ filter:brightness(.95); }
.form-button:active{ transform:translateY(1px); }
.form-button:focus-visible{ outline:3px solid rgba(0,123,255,.35); outline-offset:2px; }

.controls-container{ display:flex; flex-wrap:wrap; gap:20px; margin:0 0 20px; }
.control-panel{
  background:var(--card); padding:15px; border-radius:8px; box-shadow:var(--shadow);
  flex:1; min-width:0;
}
.control-title{ font-size:1rem; font-weight:700; margin:0 0 10px; color:#555; }
.search-row{ display:flex; gap:8px; flex-wrap:wrap; }
input[type="text"]{
  flex:1 1 220px; padding:8px 10px; font-size:1rem;
  border:1px solid #ccc; border-radius:4px;
}
select{
  width:100%; padding:8px 10px; font-size:1rem;
  border:1px solid #ccc; border-radius:4px; background:#fff;
}
.select-row{ margin-top:10px; }
button{
  padding:8px 15px; font-size:1rem; cursor:pointer;
  border:1px solid #ccc; background:#f9f9f9; border-radius:4px;
  transition:background-color .2s;
}
button:hover{ background:#eee; }
#btn-search{ background:var(--blue); color:#fff; border-color:var(--blue2); }
#btn-search:hover{ background:#0062cc; }
.helper-text{ font-size:.85rem; color:var(--muted); margin-top:5px; }
button.active{ background:#ffe0e0; border-color:#ff4d4d; color:#c00; font-weight:700; }

#coord-area{ display:none; margin-top:10px; }
textarea{
  width:100%; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  padding:10px; border-radius:4px; border:1px solid #ccc; resize:vertical;
}

.map-wrapper{ background:var(--card); padding:10px; border-radius:8px; box-shadow:var(--shadow); overflow:hidden; }
#map-container{
  touch-action: pan-y pinch-zoom;
}

#map-inner{ position:relative; display:inline-block; transform-origin:0 0; will-change:transform; }
#bg-img{
  display:block; width:100%; height:auto; border:1px solid #ddd; background:#eee;
  -webkit-user-drag:none; user-drag:none;
}
@media (min-width:768px){ #map-inner{ margin-left:40px; } }

.shelf-area{
  position:absolute;
  background:rgba(0,123,255,.2);
  border:1px solid rgba(0,123,255,.6);
  cursor:pointer;
  transition:background-color .2s, border-color .2s;
}
.shelf-area:hover{ background:rgba(0,123,255,.5); }
.shelf-area.highlight-red{
  background:rgba(255,0,0,.4);
  border-color:rgba(255,0,0,.8);
  z-index:10;
}
.shelf-area.highlight-red:hover{ background:rgba(255,0,0,.6); }
.coord-mode .shelf-area{
  pointer-events:none;
  background:rgba(150,150,150,.2);
  border-color:rgba(150,150,150,.5);
}

#selection-box{
  display:none; position:absolute;
  border:2px dashed #ff4d4d; background:rgba(255,77,77,.2);
  pointer-events:none;
}
#tooltip{
  display:none; position:absolute; z-index:1000;
  background:rgba(255,255,255,.95); border:1px solid #999;
  padding:10px 15px; border-radius:4px;
  font-size:14px; line-height:1.5; color:#333;
  pointer-events:none; box-shadow:0 4px 8px rgba(0,0,0,.15);
  white-space:nowrap;
}
.highlight-text{ color:red; font-weight:700; }
@media (max-width:600px){
  body{ margin:10px; }
  .controls-container{ flex-direction:column; gap:12px; }
  #tooltip{ white-space:normal; max-width:80vw; font-size:13px; }
}
</style>
</head>

<body>
<h1>倉庫収納物管理マップ</h1>

<a class="form-button" href="https://forms.gle/Hv3VR8cjrpyWa3oM7" target="_blank" rel="noopener noreferrer">

    <div class="control-title">収納物検索</div>

      <select id="item-select">
        <option value="">（リストから選択）</option>
      </select>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-title">管理者メニュー</div>
    <button id="toggle-coord-mode">座標取得モード：OFF</button>
    <div class="helper-text">ONにすると、図面上をドラッグして追加する棚の座標を取得できます。</div>
    <div id="coord-area">
      <textarea id="coord-output" rows="3" placeholder="ドラッグした範囲のデータがここに出力されます。"></textarea>
    </div>
  </div>
</div>

<div class="map-wrapper">

</div>

<div id="tooltip"></div>

<script>
/* -----------------------------

const shelfData = [

  { top: 34.99, left: 1.40, width: 4.04, height: 9.69, items: ["社員用個人棚"] },
  { top: 25.06, left: 1.40, width: 4.04, height: 9.69, items: ["社員用個人棚"] },
  { top: 18.64, left: 1.40, width: 4.04, height: 6.4, items: ["社員用個人棚"] },
  { top: 12.11, left: 1.40, width: 4.04, height: 6.4, items: ["1段目: テント","2段目: バルーンライト","3段目: 空き","4段目: 車用チェーン、三角停止版","5段目: 空箱"] },

  { top: 51.21, left: 23.95, width: 8.09, height: 11.2, items: ["1段目: 発動発電機、オイル、ガソリン、エンジンポンプ","2段目: 材料(照明)","3段目: 材料","上段: 空き"] },
  { top: 62.83, left: 23.95, width: 8.09, height: 11.2, items: ["1段目: 材料","2段目: 材料","3段目: 養生シート(マット)","4段目: ブルーシート、防災シート"] },
  { top: 39.83, left: 15.55, width: 8.09, height: 11.2, items: ["1段目: 電源タップ","2段目: 材料(再エネ)、絶縁工具","3段目: 雑材","上段: 空き"] },
  { top: 51.21, left: 15.55, width: 8.09, height: 11.2, items: ["白山ソーラーカーポート資材"] },
  { top: 62.83, left: 15.55, width: 8.09, height: 11.2, items: ["白山ソーラーカーポート資材"] },
  { top: 65.38, left: 70.14, width: 4.04, height: 10.90, items: ["工事看板(徐行、m先、工事中)"] },
  { top: 55.45, left: 70.14, width: 4.04, height: 9.90, items: ["1段目: コーキング","2段目: クランプ、共通工具箱","3段目: 共通工具(ペンチ、ドライバー、ハンマー等)","上段: 誘導棒"] },
  { top: 45.16, left: 70.14, width: 4.04, height: 9.90, items: ["1段目: ウエス","2段目: スプレー缶","3段目: テープ類(ビニル、エフコ、養生)","上段: アルコール、雑材"] }
];

/* -----------------------------
  DOM helpers
----------------------------- */
const $ = (s, r=document) => r.querySelector(s);
const mapContainer = $('#map-container');
const mapInner = $('#map-inner');
const tooltip = $('#tooltip');
const selectionBox = $('#selection-box');
const coordOutput = $('#coord-output');
const btnCoordMode = $('#toggle-coord-mode');
const coordArea = $('#coord-area');
const searchInput = $('#search-input');
const itemSelect = $('#item-select');

const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* -----------------------------
  Zoom / Pan
----------------------------- */

["gesturestart", "gesturechange", "gestureend"].forEach(type => {
  document.addEventListener(type, (e) => {
    if (mapContainer.contains(e.target)) e.preventDefault();
  }, { passive:false });
});

let view = { x: 0, y: 0, scale: 1 };
const MIN_SCALE = 1, MAX_SCALE = 4;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const applyTransform = () => (mapInner.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`);

const localPointFromClient = (clientX, clientY) => {
  const cr = mapContainer.getBoundingClientRect();
  return { x:(clientX - cr.left) - mapInner.offsetLeft, y:(clientY - cr.top) - mapInner.offsetTop };
};
const contentPointFromClient = (clientX, clientY) => {
  const p = localPointFromClient(clientX, clientY);
  return { x:(p.x - view.x) / view.scale, y:(p.y - view.y) / view.scale };
};
const dist = (a,b) => Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);

const pointers = new Map();
let gesture = { mode:null, startX:0, startY:0, startViewX:0, startViewY:0, startDist:0, startScale:1, centerLocal:{x:0,y:0}, moved:false };
const TAP_MOVE_THRESHOLD = 6;

let isCoordMode = false;

/* ★修正版：等倍でも pointer を拾い、2本指ピンチを必ず開始できる */
function setMapTouchAction(){
  // 等倍ならページスクロール優先、拡大中なら図面操作優先
  mapContainer.style.touchAction = (view.scale > 1.0001) ? 'none' : 'pan-y pinch-zoom';
}

setMapTouchAction();

/* 重要：等倍は1本指を“取らない”。2本指が来たらピンチ開始 */
mapContainer.addEventListener('pointerdown', (e) => {
  if (isCoordMode) return;

  pointers.set(e.pointerId, e);

  const isTouchLike = (e.pointerType === 'touch' || e.pointerType === 'pen');

  // 2本指が揃ったら：図面ピンチを開始（ページ側の動作を止める）
  if (pointers.size === 2){
    e.preventDefault();
    setMapTouchAction();            // この時点ではまだ1xかもだが、ピンチ中は止めたい
    mapContainer.style.touchAction = 'none';

    mapContainer.setPointerCapture(e.pointerId);

    const [p0, p1] = [...pointers.values()];
    gesture.mode = "pinch";
    gesture.startDist = dist(p0, p1);
    gesture.startScale = view.scale;
    gesture.moved = false;

    const cx = (p0.clientX + p1.clientX) / 2;
    const cy = (p0.clientY + p1.clientY) / 2;
    gesture.centerLocal = localPointFromClient(cx, cy);
    return;
  }

  // 1本指：
  // - 等倍(1x) かつ タッチ：ページスクロール優先（preventDefaultしない / captureしない）
  // - 拡大中(>1x) または マウス：図面パン優先（preventDefault + capture）
  const shouldPanMap = (!isTouchLike) || (view.scale > 1.0001);

  if (!shouldPanMap) {
    setMapTouchAction(); // pan-y pinch-zoom のまま
    return;
  }

  e.preventDefault();
  setMapTouchAction(); // >1xなら none になる
  mapContainer.setPointerCapture(e.pointerId);

  gesture.mode = "pan";
  gesture.startX = e.clientX;
  gesture.startY = e.clientY;
  gesture.startViewX = view.x;
  gesture.startViewY = view.y;
  gesture.moved = false;
}, { passive:false, capture:true });

mapContainer.addEventListener('pointermove', (e) => {
  if (isCoordMode || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);

  // ピンチ
  if (pointers.size === 2 && gesture.mode === "pinch"){
    e.preventDefault();

    const [p0, p1] = [...pointers.values()];
    const d = dist(p0, p1);
    if (d <= 0) return;

    const before = view.scale;
    const newScale = clamp(gesture.startScale * (d / gesture.startDist), MIN_SCALE, MAX_SCALE);

    const { x:cx, y:cy } = gesture.centerLocal;
    const ratio = newScale / before;

    view.x = cx - (cx - view.x) * ratio;
    view.y = cy - (cy - view.y) * ratio;
    view.scale = newScale;

    applyTransform();
    setMapTouchAction(); // ここで >1x になったら以降は図面優先に切替
    return;
  }

  // パン（※拡大中のみ）
  if (pointers.size === 1 && gesture.mode === "pan"){
    e.preventDefault();

    const dx = e.clientX - gesture.startX;
    const dy = e.clientY - gesture.startY;
    if (Math.abs(dx) + Math.abs(dy) > TAP_MOVE_THRESHOLD) gesture.moved = true;

    view.x = gesture.startViewX + dx;
    view.y = gesture.startViewY + dy;
    applyTransform();
  }
}, { passive:false, capture:true });

function endPointer(e){
  pointers.delete(e.pointerId);

  // ピンチが終わって指が1本残った場合：
  // 拡大中なら、そのままドラッグでパンできるように pan モードへ移行
  if (pointers.size === 1){
    const remain = [...pointers.values()][0];
    if (view.scale > 1.0001){
      gesture.mode = "pan";
      gesture.startX = remain.clientX;
      gesture.startY = remain.clientY;
      gesture.startViewX = view.x;
      gesture.startViewY = view.y;
      gesture.moved = false;

      // 残った指をキャプチャして、スクロールに取られないようにする
      try { mapContainer.setPointerCapture(remain.pointerId); } catch(_) {}
      mapContainer.style.touchAction = 'none';
    } else {
      // 等倍に戻ってるならスクロール優先
      gesture.mode = null;
      setMapTouchAction();
    }
    return;
  }

  if (pointers.size === 0){
    gesture.mode = null;
    setMapTouchAction();
  }
}

mapContainer.addEventListener('pointerup', endPointer, { passive:false, capture:true });
mapContainer.addEventListener('pointercancel', endPointer, { passive:false, capture:true });

mapInner.addEventListener('wheel', (e) => {
  if (isCoordMode) return;
  e.preventDefault();

  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
  const newScale = clamp(view.scale * zoomFactor, MIN_SCALE, MAX_SCALE);

  const pLocal = localPointFromClient(e.clientX, e.clientY);
  const pContent = contentPointFromClient(e.clientX, e.clientY);

  view.scale = newScale;
  view.x = pLocal.x - pContent.x * newScale;
  view.y = pLocal.y - pContent.y * newScale;
  applyTransform();
}, { passive:false, capture:true });

applyTransform();

/* -----------------------------
  Tooltip / Shelf render
----------------------------- */
let activeShelfEl = null;
const shelfElements = [];

document.addEventListener('pointerdown', () => {
  activeShelfEl = null;
  tooltip.style.display = 'none';
});

const buildTooltipHtml = (items) => {
  const k = searchInput.value.trim();
  if (!k) return items.join('<br>');
  const re = new RegExp(`(${escapeRegExp(k)})`, 'g');
  return items.map(t => String(t).replace(re, '<span class="highlight-text">$1</span>')).join('<br>');
};

const showTooltipAt = (pageX, pageY, items) => {
  tooltip.innerHTML = buildTooltipHtml(items);
  tooltip.style.display = 'block';
  tooltip.style.left = (pageX + 15) + 'px';
  tooltip.style.top  = (pageY + 15) + 'px';
};

shelfData.forEach(shelf => {
  const el = document.createElement('div');
  el.className = 'shelf-area';
  Object.assign(el.style, {
    top: shelf.top + "%", left: shelf.left + "%", width: shelf.width + "%", height: shelf.height + "%"
  });

  el.addEventListener('mouseenter', () => {
    tooltip.innerHTML = buildTooltipHtml(shelf.items);
    tooltip.style.display = 'block';
  });
  el.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.pageX + 15) + 'px';
    tooltip.style.top  = (e.pageY + 15) + 'px';
  });
  el.addEventListener('mouseleave', () => {
    if (activeShelfEl !== el) tooltip.style.display = 'none';
  });

  el.addEventListener('pointerdown', (e) => {
    if (isCoordMode || gesture.moved) return;
    e.preventDefault();
    e.stopPropagation();

    if (activeShelfEl === el && tooltip.style.display === 'block'){
      activeShelfEl = null;
      tooltip.style.display = 'none';
      return;
    }
    activeShelfEl = el;
    const pageX = e.pageX ?? (e.clientX + window.scrollX);
    const pageY = e.pageY ?? (e.clientY + window.scrollY);
    showTooltipAt(pageX, pageY, shelf.items);
  }, { passive:false });

  mapInner.appendChild(el);
  shelfElements.push({ data:shelf, element:el });
});

/* -----------------------------
  Search / Highlight
----------------------------- */
const highlightByKeyword = (keyword) => {
  const k = (keyword ?? '').trim();
  shelfElements.forEach(({data, element}) => {
    const hit = k && data.items.some(t => String(t).includes(k));
    element.classList.toggle('highlight-red', !!hit);
  });
};

const resetSearch = () => {
  searchInput.value = '';
  itemSelect.value = '';
  highlightByKeyword('');
};

const performSearch = () => {
  const k = searchInput.value.trim();
  if (!k) return resetSearch();
  itemSelect.value = '';
  highlightByKeyword(k);
};

$('#btn-search').addEventListener('click', performSearch);
$('#btn-reset').addEventListener('click', resetSearch);
searchInput.addEventListener('keydown', (e) => (e.key === 'Enter') && performSearch());

/* リスト（固定候補） */
[
  "セーフティコーン","コーンバー","矢印板","発電機","除雪機","脚立","レーザー墨出機","ガス検知器",
  "マンホール換気扇(送風機)","通気マスク","水中ポンプ","エンジンポンプ","絶縁工具","スポットクーラー",
  "扇風機","養生シート","LEDライト","長尺物",
].forEach(name => {
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  itemSelect.appendChild(opt);
});

itemSelect.addEventListener('change', () => {
  const v = itemSelect.value;
  searchInput.value = v;
  highlightByKeyword(v);
});

/* -----------------------------
  Coord mode
----------------------------- */
let isDragging = false;
let startX = 0, startY = 0;

btnCoordMode.addEventListener('click', () => {
  isCoordMode = !isCoordMode;

  if (isCoordMode){
    view = { x:0, y:0, scale:1 };
    applyTransform();

    btnCoordMode.textContent = "座標取得モード：ON";
    btnCoordMode.classList.add('active');
    mapContainer.classList.add('coord-mode');
    mapContainer.style.cursor = "crosshair";
    coordArea.style.display = "block";
    tooltip.style.display = "none";
    activeShelfEl = null;

    // 念のため coord mode 中は標準に戻す
    mapContainer.style.touchAction = 'pan-y pinch-zoom';
  } else {
    btnCoordMode.textContent = "座標取得モード：OFF";
    btnCoordMode.classList.remove('active');
    mapContainer.classList.remove('coord-mode');
    mapContainer.style.cursor = "default";
    selectionBox.style.display = "none";
    coordArea.style.display = "none";
  }
});

mapInner.addEventListener('mousedown', (e) => {
  if (!isCoordMode) return;
  e.preventDefault();

  const rect = mapInner.getBoundingClientRect();
  startX = e.clientX - rect.left;
  startY = e.clientY - rect.top;
  isDragging = true;

  selectionBox.style.cssText = `
    display:block;
    left:${(startX/rect.width*100)}%;
    top:${(startY/rect.height*100)}%;
    width:0%;
    height:0%;
  `;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = mapInner.getBoundingClientRect();

  const curX = clamp(e.clientX - rect.left, 0, rect.width);
  const curY = clamp(e.clientY - rect.top, 0, rect.height);

  const left = Math.min(startX, curX);
  const top  = Math.min(startY, curY);
  const w = Math.abs(curX - startX);
  const h = Math.abs(curY - startY);

  selectionBox.style.left = (left / rect.width * 100) + "%";
  selectionBox.style.top  = (top  / rect.height * 100) + "%";
  selectionBox.style.width  = (w / rect.width * 100) + "%";
  selectionBox.style.height = (h / rect.height * 100) + "%";
});

window.addEventListener('mouseup', (e) => {
  if (!isDragging) return;
  isDragging = false;

  const rect = mapInner.getBoundingClientRect();
  const endX = clamp(e.clientX - rect.left, 0, rect.width);
  const endY = clamp(e.clientY - rect.top, 0, rect.height);

  const left = Math.min(startX, endX) / rect.width * 100;
  const top  = Math.min(startY, endY) / rect.height * 100;
  const width  = Math.abs(endX - startX) / rect.width * 100;
  const height = Math.abs(endY - startY) / rect.height * 100;

  if (width > 0.5 && height > 0.5){
    coordOutput.value =
`{
  top: ${top.toFixed(2)},
  left: ${left.toFixed(2)},
  width: ${width.toFixed(2)},
  height: ${height.toFixed(2)},
  items: [
    "1段目: 〇〇",
    "2段目: 〇〇"
  ]
},`;
  } else {
    selectionBox.style.display = "none";
  }
});
</script>
